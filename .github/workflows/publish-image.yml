name: Publish production image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: caecomp-production-image
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck -- --incremental false
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_APPWRITE_ENDPOINT: https://api.radiovigilantesgo.com.br/v1
          NEXT_PUBLIC_APPWRITE_PROJECT_ID: caecomp
          NEXT_PUBLIC_SITE_URL: https://caecomp.com.br
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/nexoracore11-cmyk/caecomp-site:latest
          build-args: |
            NEXT_PUBLIC_APPWRITE_ENDPOINT=https://api.radiovigilantesgo.com.br/v1
            NEXT_PUBLIC_APPWRITE_PROJECT_ID=caecomp
            NEXT_PUBLIC_SITE_URL=https://caecomp.com.br
      - name: Publish deployable image archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker pull ghcr.io/nexoracore11-cmyk/caecomp-site:latest
          docker save ghcr.io/nexoracore11-cmyk/caecomp-site:latest | gzip -9 > caecomp-portal.tar.gz
          if gh release view deployment-image >/dev/null 2>&1; then
            gh release upload deployment-image caecomp-portal.tar.gz --clobber
          else
            gh release create deployment-image caecomp-portal.tar.gz --title "CAECOMP production image" --notes "Imagem compilada automaticamente para implantação na VPS."
          fi
